# Docker Compose V2 format (no version required)

services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mullagain
      POSTGRES_PASSWORD: mullagain
      POSTGRES_DB: mullagain
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mullagain -d mullagain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mullagain-network

  # .NET 8 Backend API
  backend:
    build: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=mullagain;Username=mullagain;Password=mullagain
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SvelteKit Frontend
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python ML Worker
  ml-worker:
    build: ./ml-worker
    environment:
      - DATABASE_URL=postgresql://mullagain:mullagain@postgres/mullagain
      - MODEL_NAME=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSION=384
      - API_HOST=0.0.0.0
      - API_PORT=7000
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "7000:7000"
    volumes:
      - ./ml-worker:/app
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Scryfall Data Loader (run once)
  data-loader:
    build: ./scripts
    environment:
      - DATABASE_URL=postgresql://mullagain:mullagain@postgres/mullagain
      - ML_WORKER_URL=http://ml-worker:7000
    depends_on:
      postgres:
        condition: service_healthy
      ml-worker:
        condition: service_healthy
    networks:
      - mullagain-network
    profiles:
      - data-load  # Only start when explicitly requested

networks:
  mullagain-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
