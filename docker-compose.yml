# Docker Compose V2 format (no version required)

services:
  # PostgreSQL database with pgvector extension and logical replication
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mullagain
      POSTGRES_PASSWORD: mullagain
      POSTGRES_DB: mullagain
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    # Configure PostgreSQL for ElectricSQL logical replication
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mullagain -d mullagain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mullagain-network

  # ElectricSQL Sync Service
  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: "postgresql://mullagain:mullagain@postgres:5432/mullagain?sslmode=disable"
      LOGICAL_PUBLISHER_HOST: "postgres"
      LOGICAL_PUBLISHER_PORT: "5432"
      PG_PROXY_PORT: "65432"
      # Development mode - insecure (don't use in production!)
      ELECTRIC_INSECURE: "true"
      # Allow direct writes to PostgreSQL (needed for admin operations)
      ELECTRIC_WRITE_TO_PG_MODE: "direct_writes"
    ports:
      - "5133:3000"  # Map external 5133 to internal 3000 (Electric's default)
      - "65432:65432"  # PostgreSQL proxy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # .NET 8 Backend API
  backend:
    build: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=mullagain;Username=mullagain;Password=mullagain
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - card-cache:/app/cache
    # Note: Volume mount for source removed - it was overwriting the compiled app
    # For local development, run: cd backend && dotnet run --project src/MtgMullagain.Api
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SvelteKit Frontend
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Python ML Worker with GPU support
  ml-worker:
    build:
      context: ./ml-worker
      dockerfile: Dockerfile
      # Use BuildKit for cache mounts and faster builds
      args:
        BUILDKIT_INLINE_CACHE: 1
    environment:
      - DATABASE_URL=postgresql://mullagain:mullagain@postgres/mullagain
      - MODEL_NAME=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSION=384
      - API_HOST=0.0.0.0
      - API_PORT=7000
      - LOG_LEVEL=INFO
      # CUDA environment variables
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "7000:7000"
    volumes:
      # Python apps can use volume mounts for hot-reload without issues
      # Unlike compiled apps (.NET), Python source can run directly
      - ./ml-worker:/app
    networks:
      - mullagain-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Scryfall Data Loader (run once)
  data-loader:
    build: ./scripts
    environment:
      - DATABASE_URL=postgresql://mullagain:mullagain@postgres/mullagain
      - ML_WORKER_URL=http://ml-worker:7000
    depends_on:
      postgres:
        condition: service_healthy
      ml-worker:
        condition: service_healthy
    networks:
      - mullagain-network
    profiles:
      - data-load  # Only start when explicitly requested

networks:
  mullagain-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  card-cache:
    driver: local
